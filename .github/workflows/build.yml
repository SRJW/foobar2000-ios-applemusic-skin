name: Build foobar2000 Skin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: pip install pillow
      - name: Generate Skin
        run: python build_skin.py
      - name: Upload .fbskin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleMusic-Skin
          path: AppleMusic.fbskin
